[project]
name = "ondeskgen"
version = "1.0.0"
description = "OnDeskGen: simulation-ready MuJoCo furniture assets from text or images with Lux3D"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.10.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "trimesh>=4.5",
    "fast-simplification>=0.1.9",        # quadric decimation backend for trimesh
    "pillow>=10.0",
    "coacd==1.0.14",                     # convex decomposition (collision hulls)
    "manycore-aholo-sdk-lux3d==1.9.0",   # Lux3D
    "manycore-aholo-sdk-asset==1.3.0",   # official upload (material-transfer reference images)
]

[project.scripts]
ondeskgen = "ondeskgen.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.14"]
build-backend = "uv_build"
