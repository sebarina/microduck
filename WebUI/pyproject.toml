[project]
name = "ondeskgen-webui"
version = "1.0.0"
description = "Web UI for OnDeskGen: demo video, asset engine, sim training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["ondeskgen"]

[tool.uv.sources]
ondeskgen = { path = "../onDeskGen", editable = true }

[project.scripts]
ondeskgen-webui = "webui.server:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "webui"
